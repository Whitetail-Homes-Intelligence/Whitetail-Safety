<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root {
    --brand: #025273;
    --brand-dark: #013b52;
    --brand-mid: #036088;
    --brand-light: #e8f1f4;
    --bg: #f2f5f6;
    --card: #ffffff;
    --border: #d7e0e3;
    --text: #17242a;
    --muted: #5b6e75;
    --radius: 14px;
    --shadow-sm: 0 1px 3px rgba(2,82,115,0.07);
    --shadow-md: 0 10px 28px rgba(2,82,115,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.top {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: white;
    padding: 34px 16px 38px;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 18px rgba(1,59,82,0.22);
  }
  header.top::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  }
  header.top img.brand-mark {
    width: 60px;
    height: 60px;
    margin-bottom: 10px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.22));
  }
  header.top h1 {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header.top p { margin: 6px 0 0; font-size: 0.9rem; opacity: 0.85; }
  .backlink {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 18px 16px 0;
    color: var(--brand-dark);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: gap 0.15s ease;
  }
  .backlink:hover { gap: 9px; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 20px;
  }
  @media (min-width: 560px) {
    .card-grid.two-col { grid-template-columns: 1fr 1fr; }
  }
  a.tile {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    text-decoration: none;
    color: var(--text);
    transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  a.tile::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--brand);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.2s ease;
  }
  a.tile:hover::before { transform: scaleY(1); }
  a.tile:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--brand-mid); }
  a.tile:active { transform: scale(0.98); }
  a.tile .tile-icon {
    font-size: 1.3rem;
    margin-bottom: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--brand-light);
  }
  a.tile h3 { margin: 0 0 4px; font-family: 'Outfit', sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--brand-dark); }
  a.tile p { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .tile.disabled {
    background: #f6f8f9;
    color: var(--muted);
    cursor: default;
    opacity: 0.75;
  }
  .tile.disabled .tile-icon { background: #e9edee; }
  .tile.disabled:hover { box-shadow: none; transform: none; }
  .tile.disabled:hover::before { transform: scaleY(0); }
  .badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .badge.soon { background: #fde9c8; color: #8a5a00; }
  .badge.live { background: #d7efe0; color: #1b6b3f; }
  h2.section-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--brand-dark);
    margin: 30px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h2.section-title::before {
    content: "";
    width: 4px; height: 18px;
    background: var(--brand);
    border-radius: 2px;
    display: inline-block;
  }
  .policy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brand);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-top: 12px;
    line-height: 1.7;
    font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
  }
  .policy-card p { margin: 0 0 14px; }
  .policy-card p:last-child { margin-bottom: 0; }
  footer.site-footer {
    text-align: center;
    padding: 12px 16px 44px;
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.02em;
  }

</style>
</head>

  <h1 id="siteHeading">Forms</h1>

<main>
  <div class="card-grid" id="formList"></div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const site = params.get('site') || '';

  document.getElementById('siteHeading').textContent = site ? `Forms — ${site}` : 'Forms';

  const FORMS = [
    {
      name: 'Field Level Hazard Assessment (FLHA)',
      icon: '⚠️',
      live: true,
      href: `flha-form.html?site=${encodeURIComponent(site)}`
    },
    {
      name: 'Hot Works Permit',
      icon: '🔥',
      live: false
    },
    {
      name: 'Toolbox Talk',
      icon: '🧰',
      live: false
    },
    {
      name: 'Site Inspection',
      icon: '🔍',
      live: false
    }
  ];

  const listEl = document.getElementById('formList');
  FORMS.forEach(f => {
    if (f.live) {
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = f.href;
      a.innerHTML = `<span class="tile-icon">${f.icon}</span><h3>${f.name}</h3><span class="badge live">Available</span>`;
      listEl.appendChild(a);
    } else {
      const div = document.createElement('div');
      div.className = 'tile disabled';
      div.innerHTML = `<span class="tile-icon">${f.icon}</span><h3>${f.name}</h3><span class="badge soon">Coming Soon</span>`;
      listEl.appendChild(div);
    }
  });
</script>
