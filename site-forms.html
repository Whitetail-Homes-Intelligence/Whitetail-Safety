<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whitetail Homes — Site Forms</title>
<style>
  :root {
    --brand: #025273;
    --brand-dark: #013b52;
    --brand-light: #e8f1f4;
    --bg: #f2f5f6;
    --card: #ffffff;
    --border: #d7e0e3;
    --text: #17242a;
    --muted: #5b6e75;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.top {
    background: var(--brand);
    color: white;
    padding: 28px 16px 32px;
    text-align: center;
  }
  header.top img { width: 56px; height: 56px; border-radius: 8px; margin-bottom: 8px; }
  header.top h1 { margin: 0; font-size: 1.3rem; font-weight: 700; }
  header.top p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
  .backlink {
    display: inline-block;
    margin: 16px 16px 0;
    color: var(--brand-dark);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 20px;
  }
  @media (min-width: 560px) {
    .card-grid.two-col { grid-template-columns: 1fr 1fr; }
  }
  a.tile {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    text-decoration: none;
    color: var(--text);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  a.tile:active { transform: scale(0.98); }
  a.tile:hover { box-shadow: 0 4px 14px rgba(2,82,115,0.12); }
  a.tile .tile-icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }
  a.tile h3 { margin: 0 0 4px; font-size: 1.05rem; color: var(--brand-dark); }
  a.tile p { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .tile.disabled {
    background: #f6f8f9;
    color: var(--muted);
    cursor: default;
    opacity: 0.7;
  }
  .tile.disabled:hover { box-shadow: none; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 6px;
  }
  .badge.soon { background: #fde9c8; color: #8a5a00; }
  .badge.live { background: #d7efe0; color: #1b6b3f; }
  h2.section-title {
    font-size: 1.05rem;
    color: var(--brand-dark);
    margin: 28px 0 4px;
  }
  .policy-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 12px;
    line-height: 1.6;
    font-size: 0.95rem;
  }
  .policy-card p { margin: 0 0 14px; }
  .policy-card p:last-child { margin-bottom: 0; }

</style>
</head>
